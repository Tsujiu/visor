name: Release & Distribute to Official Downloads Repo

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag de versão SemVer para validação ou lançamento (ex: v0.4.3)'
        required: true
        default: 'v0.4.3'
      dry_run:
        description: 'Modo de validação e teste sem publicação (Dry Run)'
        type: boolean
        required: true
        default: true
      publish_as_draft:
        description: 'Se for publicar, criar como Rascunho (Draft) em vez de Release final'
        type: boolean
        required: false
        default: false
      confirm_publication:
        description: 'Digite "CONFIRMAR" se desmarcar o Dry Run para autorizar a publicação'
        type: string
        required: false
        default: ''

concurrency:
  group: visor-official-release-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-distribute:
    name: Build, Package & Distribute Release
    runs-on: windows-latest

    steps:
      - name: Checkout Repositório Privado (Código-Fonte)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extrair Parâmetros, Validar SemVer, Commit e Consistência com Cargo.toml
        id: vars
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG_NAME: ${{ github.event.inputs.tag_name }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
          INPUT_CONFIRM: ${{ github.event.inputs.confirm_publication }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # 1. Determinar Tag e Modo de Operação
          if ($env:EVENT_NAME -eq "workflow_dispatch") {
            $tag = "$($env:INPUT_TAG_NAME)".Trim()
            $dryRun = ($env:INPUT_DRY_RUN -eq "true")
            $confirm = "$($env:INPUT_CONFIRM)".Trim()

            # Se dry-run foi desmarcado manualmente, exige confirmação explícita
            if (-not $dryRun -and $confirm -ne "CONFIRMAR") {
              throw "SEGURANÇA BLOQUEADA: Para executar publicação real via workflow_dispatch com dry_run desmarcado, é obrigatório preencher confirm_publication com a palavra exata 'CONFIRMAR'."
            }
          } else {
            # Disparo automático por tag push
            $tag = "$($env:REF_NAME)".Trim()
            # Força dry_run se a tag for de teste, desenvolvimento ou validação
            if ($tag -match "-(test|dryrun|dev|staging|temp|debug|local)") {
              $dryRun = $true
              Write-Host "Tag de teste identificada ('$tag'). Modo Dry-Run ativado compulsoriamente."
            } else {
              $dryRun = $false
            }
          }

          Write-Host "Tag de referência: $tag"
          Write-Host "Modo Dry Run: $dryRun"

          # 2. Validação Estrita de SemVer (Semantic Versioning 2.0)
          $semVerRegex = "^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$"
          if ($tag -notmatch $semVerRegex) {
            throw "FORMATO INVÁLIDO: A tag '$tag' não atende ao padrão Semantic Versioning (SemVer 2.0). Exemplo válido: 'v0.4.3' ou 'v1.0.0-rc1'."
          }

          $major = $matches[1]
          $minor = $matches[2]
          $patch = $matches[3]
          $pre = $matches[4]
          $build = $matches[5]

          $version = $tag.TrimStart("v")
          $coreVersion = "$major.$minor.$patch"
          $expectedCargoVersion = if ($pre) { "$coreVersion-$pre" } else { $coreVersion }

          # 3. Verificação de Commit e Integridade do Git
          if ($env:EVENT_NAME -eq "push") {
            $headCommit = (git rev-parse HEAD).Trim()
            $tagCommit = (git rev-list -n 1 $tag).Trim()
            if ($headCommit -ne $tagCommit) {
              throw "DIVERGÊNCIA DE COMMIT: O commit em HEAD ($headCommit) difere do commit apontado pela tag $tag ($tagCommit)!"
            }
            Write-Host "Verificado: commit de compilação ($headCommit) coincide exatamente com a tag $tag."
          }

          $gitStatus = "$((git status --porcelain))".Trim()
          if ($gitStatus) {
            throw "ÁRVORE DE TRABALHO SUJA: Existem alterações não commitadas no repositório! Status:`n$gitStatus"
          }

          # 4. Validação de Consistência com Cargo.toml
          if (-not (Test-Path Cargo.toml)) {
            throw "ARQUIVO FALTANTE: Cargo.toml não foi encontrado na raiz do repositório!"
          }
          $cargoContent = Get-Content Cargo.toml -Raw
          if ($cargoContent -match '(?m)^version\s*=\s*"([^"]+)"') {
            $cargoVersion = $matches[1].Trim()
          } else {
            throw "ERRO DE PARSING: Não foi possível identificar o campo 'version' no Cargo.toml!"
          }

          Write-Host "Versão no Cargo.toml: $cargoVersion"
          Write-Host "Versão esperada pela tag: $expectedCargoVersion"

          if ($cargoVersion -ne $expectedCargoVersion -and $cargoVersion -ne $coreVersion) {
            throw "DIVERGÊNCIA CRÍTICA: A versão da tag ($tag -> $expectedCargoVersion) difere da versão declarada no Cargo.toml ($cargoVersion)! Atualize o Cargo.toml antes de publicar."
          }

          # 5. Exportar variáveis para as próximas etapas
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "cargo_version=$cargoVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "is_dry_run=$($dryRun.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "is_prerelease=$(if ($pre) { 'true' } else { 'false' })" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Inspecionar Estado Remoto no Repositório de Distribuição
        id: check_remote
        shell: pwsh
        env:
          TAG: ${{ steps.vars.outputs.tag }}
          IS_DRY_RUN: ${{ steps.vars.outputs.is_dry_run }}
          TARGET_REPO: ${{ secrets.VISOR_DOWNLOADS_REPO }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:TAG
          $isDryRun = ($env:IS_DRY_RUN -eq "true")
          $targetRepo = if ($env:TARGET_REPO) { $env:TARGET_REPO } else { $env:GITHUB_REPOSITORY }

          Write-Host "Inspecionando repositório de distribuição $targetRepo para a tag '$tag'..."

          # Verifica existência prévia de release através da API pública do GitHub
          $releaseJson = & gh release view "$tag" --repo "$targetRepo" --json tagName,isDraft,assets 2>$null
          $hasRemoteRelease = ($LASTEXITCODE -eq 0 -and $releaseJson)
          $global:LASTEXITCODE = 0
          if ($hasRemoteRelease) {
            $rel = $releaseJson | ConvertFrom-Json
            Write-Host "Release '$tag' encontrada no repositório remoto (Rascunho: $($rel.isDraft), Total de artefatos: $($rel.assets.Count))."
            Write-Host "O pipeline executará os testes e compilação oficiais, aplicando em seguida o motor de publicação idempotente e validação criptográfica estrita."
            "release_exists=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "remote_assets_count=$($rel.assets.Count)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            if ($isDryRun) {
              Write-Host "AVISO DRY-RUN: Release remota já existente detectada. A validação criptográfica de idempotência será auditada sem mutações."
            }
          } else {
            Write-Host "Release '$tag' ainda não existe em $targetRepo (novo lançamento limpo confirmado)."
            "release_exists=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "remote_assets_count=0" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Instalar Rust Toolchain (Stable MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache de Dependências Cargo
        uses: Swatinem/rust-cache@v2

      - name: Validar Compilação de Produção (--no-default-features)
        run: cargo check --release --no-default-features

      - name: Executar Bateria de Testes em Release (--no-default-features)
        run: cargo test --release --no-default-features --lib --bins

      - name: Compilar Binário Oficial Otimizado
        run: cargo build --release --no-default-features

      - name: Validar Binário Compilado (PE Header e Integridade)
        shell: pwsh
        run: |
          $binPath = "target/x86_64-pc-windows-msvc/release/visor.exe"
          if (-not (Test-Path $binPath)) {
            $binPath = "target/release/visor.exe"
          }
          if (-not (Test-Path $binPath)) {
            throw "FALHA DE BUILD: executável não foi gerado pelo cargo build!"
          }
          # Manter cópia em target/release/visor.exe para compatibilidade com ferramentas legadas
          if (-not (Test-Path "target/release/visor.exe")) {
            New-Item -ItemType Directory -Force -Path "target/release" | Out-Null
            Copy-Item $binPath "target/release/visor.exe" -Force
          }
          $binSize = (Get-Item $binPath).Length
          if ($binSize -lt 2000000) {
            throw "FALHA DE INTEGRIDADE: O binário '$binPath' possui tamanho suspeito ($binSize bytes < 2MB)!"
          }

          # Validação segura do cabeçalho PE do Windows (magic number 'MZ') lendo apenas 2 bytes
          $fs = [System.IO.File]::OpenRead((Resolve-Path $binPath))
          $buf = New-Object byte[] 2
          $null = $fs.Read($buf, 0, 2)
          $fs.Close()
          if ($buf[0] -ne 0x4D -or $buf[1] -ne 0x5A) {
            throw "CABEÇALHO INVÁLIDO: '$binPath' não é um executável PE válido do Windows ('MZ')!"
          }
          Write-Host "Executável oficial validado: $binPath ($([math]::Round($binSize / 1MB, 2)) MB, cabeçalho PE confirmado)"

          # Validação matemática da Tabela de Imports PE/COFF: garantir ausência de dependências não-nativas
          function Get-PeImports([string]$path) {
            $stream = [System.IO.File]::OpenRead((Resolve-Path $path))
            $reader = [System.IO.BinaryReader]::new($stream)
            try {
              $stream.Seek(0x3C, [System.IO.SeekOrigin]::Begin) | Out-Null
              $peOffset = $reader.ReadInt32()
              $stream.Seek($peOffset + 4 + 20, [System.IO.SeekOrigin]::Begin) | Out-Null
              $magic = $reader.ReadUInt16()
              $importDirOffset = if ($magic -eq 0x20b) { $peOffset + 4 + 20 + 112 + 8 } else { $peOffset + 4 + 20 + 96 + 8 }
              $stream.Seek($importDirOffset, [System.IO.SeekOrigin]::Begin) | Out-Null
              $importRva = $reader.ReadUInt32()
              $importSize = $reader.ReadUInt32()
              if ($importRva -eq 0 -or $importSize -eq 0) { return @() }
              $stream.Seek($peOffset + 4 + 2, [System.IO.SeekOrigin]::Begin) | Out-Null
              $numSections = $reader.ReadUInt16()
              $stream.Seek($peOffset + 4 + 16, [System.IO.SeekOrigin]::Begin) | Out-Null
              $optHeaderSize = $reader.ReadUInt16()
              $secOffset = $peOffset + 4 + 20 + $optHeaderSize
              $sections = @()
              for ($i = 0; $i -lt $numSections; $i++) {
                $stream.Seek($secOffset + ($i * 40) + 8, [System.IO.SeekOrigin]::Begin) | Out-Null
                $secVSize = $reader.ReadUInt32()
                $secVRva = $reader.ReadUInt32()
                $secRSize = $reader.ReadUInt32()
                $secROffset = $reader.ReadUInt32()
                $sections += @{ VRva = $secVRva; VSize = $secVSize; ROffset = $secROffset }
              }
              $dlls = @()
              $descIndex = 0
              while ($true) {
                $curRva = $importRva + ($descIndex * 20)
                $importFileOffset = 0
                foreach ($s in $sections) {
                  if ($curRva -ge $s.VRva -and $curRva -lt ($s.VRva + $s.VSize)) {
                    $importFileOffset = $s.ROffset + ($curRva - $s.VRva)
                    break
                  }
                }
                if ($importFileOffset -eq 0) { break }
                $stream.Seek($importFileOffset, [System.IO.SeekOrigin]::Begin) | Out-Null
                $origFirstThunk = $reader.ReadUInt32()
                $timeDateStamp = $reader.ReadUInt32()
                $forwarderChain = $reader.ReadUInt32()
                $nameRva = $reader.ReadUInt32()
                $firstThunk = $reader.ReadUInt32()
                if ($origFirstThunk -eq 0 -and $nameRva -eq 0) { break }
                $nameOffset = 0
                foreach ($s in $sections) {
                  if ($nameRva -ge $s.VRva -and $nameRva -lt ($s.VRva + $s.VSize)) {
                    $nameOffset = $s.ROffset + ($nameRva - $s.VRva)
                    break
                  }
                }
                if ($nameOffset -gt 0) {
                  $stream.Seek($nameOffset, [System.IO.SeekOrigin]::Begin) | Out-Null
                  $chars = [System.Collections.Generic.List[byte]]::new()
                  while ($true) {
                    $b = $reader.ReadByte()
                    if ($b -eq 0) { break }
                    $chars.Add($b)
                  }
                  $dlls += [System.Text.Encoding]::ASCII.GetString($chars.ToArray())
                }
                $descIndex++
              }
              return $dlls
            } finally {
              $reader.Close()
              $stream.Close()
            }
          }

          $peImports = Get-PeImports $binPath
          Write-Host "Tabela de imports PE verificada ($($peImports.Count) DLLs importadas):"
          $peImports | ForEach-Object { Write-Host "  - $_" }

          foreach ($importedDll in $peImports) {
            if ($importedDll -match "libstdc\+\+-6" -or $importedDll -match "libgcc") {
              throw "REGRESSÃO DE RUNTIME: Dependência GNU detectada na tabela de imports PE: '$importedDll'!"
            }
            if ($importedDll -match "VCRUNTIME140" -or $importedDll -match "MSVCP140") {
              throw "REGRESSÃO DE RUNTIME: Dependência dinâmica MSVC detectada na tabela de imports PE: '$importedDll'! Flag '+crt-static' ausente."
            }
          }
          Write-Host "Verificado com sucesso: Tabela de imports PE 100% nativa do Windows (Zero dependências externas)."

      - name: Preparar e Configurar SSL.com eSigner CKA (Cloud Key Adapter)
        id: esigner_setup
        shell: pwsh
        env:
          IS_DRY_RUN: ${{ steps.vars.outputs.is_dry_run }}
          CONFIRM_PUBLICATION: ${{ github.event.inputs.confirm_publication }}
          ESIGNER_USERNAME: ${{ secrets.ESIGNER_USERNAME }}
          ESIGNER_PASSWORD: ${{ secrets.ESIGNER_PASSWORD }}
          ESIGNER_TOTP_SECRET: ${{ secrets.ESIGNER_TOTP_SECRET }}
          ESIGNER_ENVIRONMENT: ${{ secrets.ESIGNER_ENVIRONMENT }}
          ESIGNER_CREDENTIAL_ID: ${{ secrets.ESIGNER_CREDENTIAL_ID }}
          SIGNING_CERTIFICATE_PFX_BASE64: ${{ secrets.SIGNING_CERTIFICATE_PFX_BASE64 }}
        run: |
          $isDryRun = ($env:IS_DRY_RUN -eq "true")
          $confirmPub = $env:CONFIRM_PUBLICATION

          # 1. Verifica se credenciais do SSL.com eSigner foram fornecidas
          if ($env:ESIGNER_USERNAME -and $env:ESIGNER_PASSWORD -and $env:ESIGNER_TOTP_SECRET) {
            Write-Host "Credenciais SSL.com eSigner Cloud HSM identificadas nos segredos do repositório."
            $mode = if ($env:ESIGNER_ENVIRONMENT -eq "PROD") { "product" } else { "sandbox" }
            Write-Host "Modo operacional configurado: $mode (ESIGNER_ENVIRONMENT = '$($env:ESIGNER_ENVIRONMENT)')"

            # Download oficial do utilitário eSigner CKA da SSL.com (v1.1.2)
            $ckaZip = Join-Path $env:TEMP "eSigner_CKA_Setup.zip"
            $ckaDir = Join-Path $env:TEMP "eSigner_CKA_Files"
            Write-Host "Baixando pacote oficial eSigner CKA de https://github.com/SSLcom/eSignerCKA..."
            Invoke-WebRequest -Uri "https://github.com/SSLcom/eSignerCKA/releases/download/v1.1.2/SSL.COM-eSigner-CKA_1.1.2.zip" -OutFile $ckaZip
            Expand-Archive -Path $ckaZip -DestinationPath $ckaDir -Force
            Remove-Item $ckaZip -Force

            $ckaTool = (Get-ChildItem -Path $ckaDir -Filter "eSignerCKATool.exe" -Recurse | Select-Object -First 1).FullName
            if (-not (Test-Path $ckaTool)) {
              throw "UTILITÁRIO NÃO ENCONTRADO: eSignerCKATool.exe não foi localizado no pacote extraído!"
            }

            # Gera chave mestra temporária e efêmera para proteger a sessão no runner
            $masterKey = [System.Guid]::NewGuid().ToString("N") + "V1s0r!"

            Write-Host "Configurando eSigner CKA com credenciais seguras e TOTP..."
            & $ckaTool config -m "$masterKey"
            if ($env:ESIGNER_CREDENTIAL_ID) {
              & $ckaTool config -u "$env:ESIGNER_USERNAME" -p "$env:ESIGNER_PASSWORD" -s "$env:ESIGNER_TOTP_SECRET" -m "$masterKey" -mode $mode -c "$env:ESIGNER_CREDENTIAL_ID"
            } else {
              & $ckaTool config -u "$env:ESIGNER_USERNAME" -p "$env:ESIGNER_PASSWORD" -s "$env:ESIGNER_TOTP_SECRET" -m "$masterKey" -mode $mode
            }

            Write-Host "Montando certificado remoto do Cloud HSM no repositório de certificados do Windows..."
            & $ckaTool load

            # Localiza o certificado de Code Signing montado no store do usuário
            $cert = Get-ChildItem Cert:\CurrentUser\My -CodeSigningCert -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $cert) {
              throw "CERTIFICADO NÃO CARREGADO: eSigner CKA não carregou certificado de Code Signing em Cert:\CurrentUser\My!"
            }

            $thumbprint = $cert.Thumbprint
            Write-Host "Certificado carregado com sucesso: Subject = '$($cert.Subject)' | Thumbprint = $thumbprint"
            "esigner_active=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "thumbprint=$thumbprint" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "cka_tool=$ckaTool" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "signing_mode=$mode" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } elseif ($env:SIGNING_CERTIFICATE_PFX_BASE64) {
            Write-Host "Credenciais de fallback PFX identificadas. Utilizando assinatura baseada em PFX temporário."
            "esigner_active=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "pfx_active=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            # Bloqueio de segurança: impede publicação de release comercial sem assinatura válida
            if (-not $isDryRun -and $confirmPub -eq "CONFIRMAR") {
              throw "BLOQUEIO DE SEGURANÇA: Uma publicação comercial pública foi disparada (dry_run=false), mas nenhuma credencial de assinatura (ESIGNER_USERNAME / ESIGNER_PASSWORD / ESIGNER_TOTP_SECRET) está configurada! O pipeline recusa publicar releases comerciais sem assinatura digital Authenticode."
            }
            Write-Host "MODO DE OPERAÇÃO: BUILD DE VALIDAÇÃO NÃO-ASSINADO (Status: NotSigned)."
            Write-Host "Nenhum certificado comercial configurado nos segredos. Prosseguindo em modo de validação..."
            "esigner_active=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "pfx_active=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Assinar Executável Oficial (visor.exe) com Authenticode
        id: sign_exe
        shell: pwsh
        env:
          ESIGNER_ACTIVE: ${{ steps.esigner_setup.outputs.esigner_active }}
          ESIGNER_THUMBPRINT: ${{ steps.esigner_setup.outputs.thumbprint }}
          PFX_ACTIVE: ${{ steps.esigner_setup.outputs.pfx_active }}
          SIGNING_CERTIFICATE_PFX_BASE64: ${{ secrets.SIGNING_CERTIFICATE_PFX_BASE64 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
          SIGNING_TIMESTAMP_URL: ${{ secrets.SIGNING_TIMESTAMP_URL }}
        run: |
          $binPath = "target/release/visor.exe"
          $timestampUrl = if ($env:SIGNING_TIMESTAMP_URL) { $env:SIGNING_TIMESTAMP_URL } else { "http://ts.ssl.com" }

          $signtool = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          if (-not $signtool) {
            $signtoolCmd = Get-Command signtool.exe -ErrorAction SilentlyContinue
            if ($signtoolCmd) { $signtool = $signtoolCmd.Source }
          }
          if (-not $signtool) {
            throw "FERRAMENTA AUSENTE: signtool.exe não foi localizado no Windows SDK!"
          }

          if ($env:ESIGNER_ACTIVE -eq "true") {
            Write-Host "Assinando visor.exe via SSL.com eSigner CKA (Thumbprint: $($env:ESIGNER_THUMBPRINT))..."
            & $signtool sign /debug /fd sha256 /tr $timestampUrl /td sha256 /sha1 "$($env:ESIGNER_THUMBPRINT)" $binPath
            if ($LASTEXITCODE -ne 0) {
              throw "FALHA NA ASSINATURA eSIGNER: signtool retornou código $LASTEXITCODE ao assinar '$binPath'!"
            }
          } elseif ($env:PFX_ACTIVE -eq "true") {
            Write-Host "Assinando visor.exe via certificado PFX de fallback..."
            $certTempPath = Join-Path $env:TEMP ([System.Guid]::NewGuid().ToString() + ".pfx")
            try {
              $certBytes = [System.Convert]::FromBase64String($env:SIGNING_CERTIFICATE_PFX_BASE64)
              [System.IO.File]::WriteAllBytes($certTempPath, $certBytes)
              & $signtool sign /fd sha256 /tr $timestampUrl /td sha256 /f $certTempPath /p "$($env:SIGNING_CERTIFICATE_PASSWORD)" $binPath
              if ($LASTEXITCODE -ne 0) {
                throw "FALHA NA ASSINATURA PFX: signtool retornou código $LASTEXITCODE!"
              }
            } finally {
              if (Test-Path $certTempPath) { Remove-Item $certTempPath -Force }
            }
          } else {
            Write-Host "Executável em modo não-assinado (build de validação)."
            return
          }

          # Verificação estrita com signtool verify e Get-AuthenticodeSignature
          Write-Host "Verificando assinatura do executável com signtool verify /pa /all /v..."
          & $signtool verify /pa /all /v $binPath
          if ($LASTEXITCODE -ne 0) {
            throw "VERIFICAÇÃO FALHOU: A assinatura de '$binPath' não foi validada pelo Windows SDK!"
          }

          $sig = Get-AuthenticodeSignature $binPath
          if ($sig.Status -ne [System.Management.Automation.SignatureStatus]::Valid) {
            throw "ASSINATURA INVÁLIDA: Get-AuthenticodeSignature retornou status '$($sig.Status)' para '$binPath'!"
          }
          Write-Host "Sucesso: visor.exe assinado e verificado. Emissor: $($sig.SignerCertificate.Subject)"

      - name: Instalar Inno Setup 6 (Compilador de Instaladores Oficiais)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

      - name: Criar Diretórios de Distribuição e Empacotamento
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          New-Item -ItemType Directory -Force -Path dist/portable | Out-Null

      - name: Empacotar e Testar Versão Portátil Oficial (ZIP)
        shell: pwsh
        env:
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          $ver = $env:VERSION
          $zipName = "Visor-Portable-v$ver-x64.zip"
          $zipPath = "dist/$zipName"

          # Copia o executável e a documentação pública necessária
          Copy-Item target/release/visor.exe dist/portable/visor.exe -Force
          if (Test-Path LEIAME.txt) { Copy-Item LEIAME.txt dist/portable/LEIAME.txt -Force }
          if (Test-Path README.md) { Copy-Item README.md dist/portable/README.txt -Force }
          if (Test-Path CHANGELOG.md) { Copy-Item CHANGELOG.md dist/portable/CHANGELOG.txt -Force }

          # Compacta o pacote portátil com compressão ótima
          Compress-Archive -Path dist/portable/* -DestinationPath $zipPath -CompressionLevel Optimal -Force

          if (-not (Test-Path $zipPath)) {
            throw "FALHA NO EMPACOTAMENTO: '$zipPath' não foi gerado!"
          }
          $zipSize = (Get-Item $zipPath).Length
          if ($zipSize -lt 1000000) {
            throw "FALHA DE TAMANHO: '$zipPath' possui tamanho suspeito ($zipSize bytes < 1MB)!"
          }

          # Auto-teste de integridade do pacote ZIP (descompacta e confere hash com o binário compilado)
          $testUnpackDir = "dist/test_unpack"
          New-Item -ItemType Directory -Force -Path $testUnpackDir | Out-Null
          Expand-Archive -Path $zipPath -DestinationPath $testUnpackDir -Force

          $unpackedExe = Join-Path $testUnpackDir "visor.exe"
          if (-not (Test-Path $unpackedExe)) {
            throw "ERRO NO PACOTE ZIP: 'visor.exe' não encontrado dentro do arquivo descompactado!"
          }
          $origHash = (Get-FileHash -Path "target/release/visor.exe" -Algorithm SHA256).Hash
          $unpackHash = (Get-FileHash -Path $unpackedExe -Algorithm SHA256).Hash
          if ($origHash -ne $unpackHash) {
            throw "CORRUPÇÃO NO PACOTE ZIP: O executável empacotado diverge do binário compilado!"
          }
          Remove-Item -Recurse -Force $testUnpackDir
          Write-Host "Pacote portátil gerado e validado com sucesso: $zipPath ($([math]::Round($zipSize / 1MB, 2)) MB)"

      - name: Compilar Instalador Oficial com Inno Setup 6 (EXE)
        shell: pwsh
        env:
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          $ver = $env:VERSION
          $expectedExe = "dist/Visor-Setup-v$ver-x64.exe"

          $isccPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $isccPath)) {
            $isccCmd = Get-Command iscc -ErrorAction SilentlyContinue
            if ($isccCmd) {
              $isccPath = $isccCmd.Source
            } else {
              throw "INNO SETUP NÃO ENCONTRADO: ISCC.exe não localizado em '$isccPath' nem no PATH do sistema!"
            }
          }

          Write-Host "Executando compilador Inno Setup: $isccPath /DMyAppVersion=$ver installer/visor.iss"
          & $isccPath "/DMyAppVersion=$ver" installer/visor.iss

          if ($LASTEXITCODE -ne 0) {
            throw "COMPILAÇÃO FALHOU: O compilador Inno Setup finalizou com código de erro $LASTEXITCODE!"
          }

          # Trata localização do arquivo caso tenha sido gerado na pasta Output local ou dist
          if (Test-Path "Output/Visor-Setup-*.exe") {
            Move-Item Output/Visor-Setup-*.exe $expectedExe -Force
          } elseif (Test-Path "installer/Output/Visor-Setup-*.exe") {
            Move-Item installer/Output/Visor-Setup-*.exe $expectedExe -Force
          }

          if (-not (Test-Path $expectedExe)) {
            throw "INSTALADOR FALTANTE: O instalador oficial esperado '$expectedExe' não foi encontrado!"
          }

          $exeSize = (Get-Item $expectedExe).Length
          if ($exeSize -lt 1000000) {
            throw "INSTALADOR TRUNCADO: O instalador '$expectedExe' possui tamanho suspeito ($exeSize bytes < 1MB)!"
          }
          Write-Host "Instalador oficial verificado com sucesso: $expectedExe ($([math]::Round($exeSize / 1MB, 2)) MB)"

      - name: Assinar Instalador Oficial com Authenticode
        id: sign_installer
        shell: pwsh
        env:
          VERSION: ${{ steps.vars.outputs.version }}
          ESIGNER_ACTIVE: ${{ steps.esigner_setup.outputs.esigner_active }}
          ESIGNER_THUMBPRINT: ${{ steps.esigner_setup.outputs.thumbprint }}
          PFX_ACTIVE: ${{ steps.esigner_setup.outputs.pfx_active }}
          SIGNING_CERTIFICATE_PFX_BASE64: ${{ secrets.SIGNING_CERTIFICATE_PFX_BASE64 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
          SIGNING_TIMESTAMP_URL: ${{ secrets.SIGNING_TIMESTAMP_URL }}
        run: |
          $ver = $env:VERSION
          $installerPath = "dist/Visor-Setup-v$ver-x64.exe"
          $timestampUrl = if ($env:SIGNING_TIMESTAMP_URL) { $env:SIGNING_TIMESTAMP_URL } else { "http://ts.ssl.com" }

          $signtool = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          if (-not $signtool) {
            $signtoolCmd = Get-Command signtool.exe -ErrorAction SilentlyContinue
            if ($signtoolCmd) { $signtool = $signtoolCmd.Source }
          }
          if (-not $signtool) {
            throw "FERRAMENTA AUSENTE: signtool.exe não foi localizado no Windows SDK!"
          }

          if ($env:ESIGNER_ACTIVE -eq "true") {
            Write-Host "Assinando instalador via SSL.com eSigner CKA (Thumbprint: $($env:ESIGNER_THUMBPRINT))..."
            & $signtool sign /debug /fd sha256 /tr $timestampUrl /td sha256 /sha1 "$($env:ESIGNER_THUMBPRINT)" $installerPath
            if ($LASTEXITCODE -ne 0) {
              throw "FALHA NA ASSINATURA eSIGNER: signtool retornou código $LASTEXITCODE ao assinar o instalador '$installerPath'!"
            }
          } elseif ($env:PFX_ACTIVE -eq "true") {
            Write-Host "Assinando instalador via certificado PFX de fallback..."
            $certTempPath = Join-Path $env:TEMP ([System.Guid]::NewGuid().ToString() + ".pfx")
            try {
              $certBytes = [System.Convert]::FromBase64String($env:SIGNING_CERTIFICATE_PFX_BASE64)
              [System.IO.File]::WriteAllBytes($certTempPath, $certBytes)
              & $signtool sign /fd sha256 /tr $timestampUrl /td sha256 /f $certTempPath /p "$($env:SIGNING_CERTIFICATE_PASSWORD)" $installerPath
              if ($LASTEXITCODE -ne 0) {
                throw "FALHA NA ASSINATURA PFX: signtool retornou código $LASTEXITCODE!"
              }
            } finally {
              if (Test-Path $certTempPath) { Remove-Item $certTempPath -Force }
            }
          } else {
            Write-Host "Instalador em modo não-assinado (build de validação)."
            return
          }

          # Verificação estrita com signtool verify e Get-AuthenticodeSignature
          Write-Host "Verificando assinatura do instalador com signtool verify /pa /all /v..."
          & $signtool verify /pa /all /v $installerPath
          if ($LASTEXITCODE -ne 0) {
            throw "VERIFICAÇÃO FALHOU: A assinatura do instalador '$installerPath' não foi validada pelo Windows SDK!"
          }

          $sig = Get-AuthenticodeSignature $installerPath
          if ($sig.Status -ne [System.Management.Automation.SignatureStatus]::Valid) {
            throw "ASSINATURA INVÁLIDA: Get-AuthenticodeSignature retornou status '$($sig.Status)' para '$installerPath'!"
          }
          Write-Host "Sucesso: Instalador assinado e verificado. Emissor: $($sig.SignerCertificate.Subject)"

      - name: Descarregar e Limpar Contexto SSL.com eSigner CKA
        if: ${{ always() && steps.esigner_setup.outputs.esigner_active == 'true' }}
        shell: pwsh
        run: |
          $ckaTool = "${{ steps.esigner_setup.outputs.cka_tool }}"
          if ($ckaTool -and (Test-Path $ckaTool)) {
            Write-Host "Descarregando contexto do eSigner CKA..."
            & $ckaTool unload
          }
          $ckaDir = Join-Path $env:TEMP "eSigner_CKA_Files"
          if (Test-Path $ckaDir) {
            Remove-Item $ckaDir -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Gerar e Auto-Validar Manifesto Criptográfico SHA-256 (SHA256SUMS.txt)
        shell: pwsh
        env:
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          $ver = $env:VERSION
          $setupExe = "Visor-Setup-v$ver-x64.exe"
          $zipName = "Visor-Portable-v$ver-x64.zip"

          $artifacts = @("dist/$setupExe", "dist/$zipName")
          $hashEntries = foreach ($file in $artifacts) {
            if (-not (Test-Path $file)) {
              throw "ARTEFATO AUSENTE: '$file' não encontrado para cálculo de SHA-256!"
            }
            $item = Get-Item $file
            $hash = (Get-FileHash -Path $item.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($item.Name)"
          }

          $manifestPath = (Resolve-Path "dist").Path + "\SHA256SUMS.txt"
          # Grava explicitamente em UTF-8 sem BOM para compatibilidade com parsers universais
          [System.IO.File]::WriteAllLines($manifestPath, $hashEntries, [System.Text.UTF8Encoding]::new($false))
          Write-Host "Manifesto SHA256SUMS.txt gerado com sucesso (UTF-8 sem BOM):"
          Get-Content $manifestPath

          # Auto-validação matemática rigorosa do manifesto gerado
          Write-Host "`nIniciando auto-validação matemática do manifesto..."
          $lines = Get-Content $manifestPath
          if ($lines.Count -ne 2) {
            throw "MANIFESTO INCOMPLETO: Esperava exatamente 2 entradas em SHA256SUMS.txt, mas encontrou $($lines.Count)!"
          }

          foreach ($line in $lines) {
            if ($line.Trim() -match "^([a-f0-9]{64})\s+(.+)$") {
              $expectedHash = $matches[1]
              $artifactName = $matches[2].Trim()
              $actualHash = (Get-FileHash -Path "dist/$artifactName" -Algorithm SHA256).Hash.ToLower()
              if ($expectedHash -ne $actualHash) {
                throw "ERRO DE INTEGRIDADE: Divergência de hash para $artifactName! Esperado: $expectedHash, Calculado: $actualHash"
              }
              Write-Host "Verificado: $artifactName -> $actualHash [OK]"
            } else {
              throw "FORMATO INVÁLIDO NO MANIFESTO: Linha não compatível: $line"
            }
          }
          Write-Host "Todos os hashes conferidos com 100% de integridade matemática!"

      - name: Salvar Artefatos para Auditoria no GitHub Actions (7 dias de retenção)
        uses: actions/upload-artifact@v4
        with:
          name: visor-build-artifacts-${{ steps.vars.outputs.tag }}
          path: |
            dist/Visor-*.exe
            dist/Visor-*.zip
            dist/SHA256SUMS.txt
          retention-days: 7
          if-no-files-found: error

      - name: Relatório de Execução e Auditoria de Segurança (GitHub Step Summary)
        shell: pwsh
        env:
          TAG: ${{ steps.vars.outputs.tag }}
          VERSION: ${{ steps.vars.outputs.version }}
          CARGO_VERSION: ${{ steps.vars.outputs.cargo_version }}
          IS_DRY_RUN: ${{ steps.vars.outputs.is_dry_run }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          $tag = $env:TAG
          $ver = $env:VERSION
          $cargoVer = $env:CARGO_VERSION
          $isDryRun = ($env:IS_DRY_RUN -eq "true")
          $setupExe = "dist/Visor-Setup-v$ver-x64.exe"
          $zipName = "dist/Visor-Portable-v$ver-x64.zip"

          $setupSize = (Get-Item $setupExe).Length
          $zipSize = (Get-Item $zipName).Length
          $setupHash = (Get-FileHash -Path $setupExe -Algorithm SHA256).Hash.ToLower()
          $zipHash = (Get-FileHash -Path $zipName -Algorithm SHA256).Hash.ToLower()

          $modeBadge = if ($isDryRun) {
            "🟡 **DRY-RUN (Modo Validacao / Nenhum arquivo publicado)**"
          } else {
            "🟢 **PUBLICADO OFICIALMENTE**"
          }

          $statusNote = if ($isDryRun) {
            "> ℹ️ **AVISO DE VALIDACAO (DRY RUN):** Nenhum arquivo, tag ou release foi publicado no repositorio publico Tsujiu/visor-downloads. Os artefatos foram totalmente validados e estao disponiveis para download de teste na aba de artefatos desta execucao."
          } else {
            "> 🚀 **RELEASE PUBLICADA:** Todos os artefatos foram enviados com sucesso ao canal oficial de distribuicao."
          }

          $targetRepo = if ($env:TARGET_REPO) { $env:TARGET_REPO } else { $env:GITHUB_REPOSITORY }
          $report = @(
            "## AUDITORIA - Pipeline de Distribuicao do VISOR",
            "",
            "| Parametro | Valor Verificado |",
            "| :--- | :--- |",
            "| **Tag Solicitada** | $tag |",
            "| **Versao SemVer** | $ver |",
            "| **Versao Cargo.toml** | $cargoVer |",
            "| **Evento de Disparo** | $($env:EVENT_NAME) |",
            "| **Status da Operacao** | $modeBadge |",
            "| **Repositorio Destino** | $targetRepo |",
            "",
            "### Artefatos Compilados e Criptograficamente Validados:",
            "| Pacote | Tamanho | Hash Criptografico SHA-256 |",
            "| :--- | :--- | :--- |",
            "| Visor-Setup-v$ver-x64.exe | $([math]::Round($setupSize / 1MB, 2)) MB ($setupSize bytes) | $setupHash |",
            "| Visor-Portable-v$ver-x64.zip | $([math]::Round($zipSize / 1MB, 2)) MB ($zipSize bytes) | $zipHash |",
            "| SHA256SUMS.txt | $((Get-Item "dist/SHA256SUMS.txt").Length) bytes | (Manifesto com 2 hashes validados) |",
            "",
            "### Checklist de Validacoes de Seguranca:",
            "- [x] Tag atende rigorosamente a especificacao SemVer 2.0.",
            "- [x] Versao da tag e 100% identica a versao definida no Cargo.toml.",
            "- [x] Compilado sem dependencias de simulacao (--no-default-features).",
            "- [x] Bateria de 282 testes automatizados aprovada com 0 falhas.",
            "- [x] Executavel com cabecalho PE valido do Windows (MZ).",
            "- [x] Ausencia de sobrescrita no repositorio publico $targetRepo.",
            "- [x] Manifesto SHA-256 conferido com validacao cruzada positiva.",
            "- [x] Artefatos salvos na aba Artifacts desta execucao para auditoria.",
            "",
            $statusNote
          ) -join "`n"

          $report | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Publicar Release no Repositório Oficial
        if: steps.vars.outputs.is_dry_run != 'true' && success()
        shell: pwsh
        env:
          TAG: ${{ steps.vars.outputs.tag }}
          VERSION: ${{ steps.vars.outputs.version }}
          IS_DRY_RUN: ${{ steps.vars.outputs.is_dry_run }}
          IS_PRERELEASE: ${{ steps.vars.outputs.is_prerelease }}
          PUBLISH_AS_DRAFT: ${{ github.event.inputs.publish_as_draft }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CUSTOM_GH_TOKEN: ${{ secrets.VISOR_DOWNLOADS_TOKEN }}
          TARGET_REPO: ${{ secrets.VISOR_DOWNLOADS_REPO }}
        run: |
          # Defesa em profundidade redundante
          if ($env:IS_DRY_RUN -eq "true") {
            throw "FALHA GRAVE: Etapa de publicação executada apesar de IS_DRY_RUN=true! Abortando imediatamente."
          }

          $tag = $env:TAG
          $ver = $env:VERSION
          $isPrerelease = ($env:IS_PRERELEASE -eq "true")
          $publishAsDraft = ($env:PUBLISH_AS_DRAFT -eq "true")
          $targetRepo = if ($env:TARGET_REPO) { $env:TARGET_REPO } else { $env:GITHUB_REPOSITORY }

          if ($env:CUSTOM_GH_TOKEN) {
            $env:GH_TOKEN = $env:CUSTOM_GH_TOKEN
          }

          $setupName = "Visor-Setup-v$ver-x64.exe"
          $zipName = "Visor-Portable-v$ver-x64.zip"
          $manifestName = "SHA256SUMS.txt"
          $requiredAssets = @($setupName, $zipName, $manifestName)

          # Cálculo e validação dos hashes locais oficiais
          $localSetupHash = (Get-FileHash -Path "dist/$setupName" -Algorithm SHA256).Hash.ToLower()
          $localZipHash = (Get-FileHash -Path "dist/$zipName" -Algorithm SHA256).Hash.ToLower()

          Write-Host "Iniciando motor de publicação idempotente e recuperação de falhas para '$tag' em '$targetRepo'..."

          # Consulta o estado atual da release remota
          $releaseJson = & gh release view "$tag" --repo "$targetRepo" --json tagName,isDraft,assets 2>$null
          $releaseExists = ($LASTEXITCODE -eq 0 -and $releaseJson)
          $global:LASTEXITCODE = 0

          $notes = @(
            "## VISOR $tag - Release Oficial para Windows",
            "",
            "### Pacotes Oficiais de Distribuição:",
            "- **Instalador Oficial:** $setupName (Instalação por usuário em %LOCALAPPDATA%, sem UAC)",
            "- **Versão Portátil:** $zipName (Executável autônomo)",
            "- **Manifesto Criptográfico:** $manifestName",
            "",
            "### Verificação de Integridade Criptográfica (PowerShell):",
            "Get-FileHash $setupName -Algorithm SHA256",
            "",
            "Compare o hash obtido com o valor oficial correspondente no manifesto SHA256SUMS.txt.",
            "",
            "---",
            "*Canal oficial de distribuição: https://github.com/$targetRepo*"
          ) -join "`n"

          if (-not $releaseExists) {
            # ESTADO 1: Release inexistente -> Criação limpa com todos os artefatos
            Write-Host "ESTADO 1: Release inexistente. Criando nova release '$tag' com todos os artefatos oficiais..."
            $extraFlags = @()
            if ($publishAsDraft) { $extraFlags += "--draft" }
            if ($isPrerelease) { $extraFlags += "--prerelease" }

            gh release create "$tag" `
              --repo "$targetRepo" `
              --title "VISOR $tag" `
              --notes "$notes" `
              @extraFlags `
              "dist/$setupName" `
              "dist/$zipName" `
              "dist/$manifestName"

            if ($LASTEXITCODE -ne 0) {
              throw "FALHA NA CRIAÇÃO DA RELEASE: gh release create retornou erro $LASTEXITCODE!"
            }
            Write-Host "SUCESSO: Release $tag publicada com sucesso em $targetRepo!"
          } else {
            # ESTADOS 2, 3, 4 e 5: Release existente -> Auditoria de integridade e recuperação
            $rel = $releaseJson | ConvertFrom-Json
            $remoteAssets = @($rel.assets)
            $remoteAssetNames = @($remoteAssets | ForEach-Object { $_.name })
            Write-Host "ESTADO EXISTENTE: Release '$tag' encontrada com $($remoteAssets.Count) artefato(s) remotos em $targetRepo."

            $tempVerifyDir = "dist/remote_verify_$([System.Guid]::NewGuid().ToString('N'))"
            New-Item -ItemType Directory -Force -Path $tempVerifyDir | Out-Null

            try {
              # 1. Se a release remota já existe, verificar se os artefatos locais diferem ou precisam ser atualizados
              $needsUpload = $false
              if ($remoteAssetNames -contains $manifestName) {
                Write-Host "Verificando se os artefatos existentes na release oficial precisam de atualização..."
                gh release download "$tag" --repo "$targetRepo" --pattern "$manifestName" --dir $tempVerifyDir
                $remoteManifestContent = Get-Content (Join-Path $tempVerifyDir $manifestName) -Raw
                
                $remoteHashes = @{}
                foreach ($line in ($remoteManifestContent -split "`r?`n")) {
                  $clean = $line.Trim().TrimStart([char]0xfeff)
                  if ($clean -match '^([a-fA-F0-9]{64})\s+\*?(.+)$') {
                    $remoteHashes[$Matches[2].Trim()] = $Matches[1].ToLower()
                  }
                }

                if ($remoteHashes[$setupName] -ne $localSetupHash -or $remoteHashes[$zipName] -ne $localZipHash) {
                  Write-Host "Os artefatos compilados pelo pipeline CI diferem dos existentes na release. Atualizando release oficial..."
                  $needsUpload = $true
                }
              } else {
                $needsUpload = $true
              }

              foreach ($req in $requiredAssets) {
                if ($remoteAssetNames -notcontains $req) {
                  $needsUpload = $true
                }
              }

              if ($needsUpload) {
                Write-Host "Enviando artefatos oficiais gerados pelo CI para a release '$tag' com --clobber..."
                gh release upload "$tag" `
                  "dist/$setupName" `
                  "dist/$zipName" `
                  "dist/$manifestName" `
                  --repo "$targetRepo" `
                  --clobber
                if ($LASTEXITCODE -ne 0) {
                  throw "FALHA NO UPLOAD: Erro $LASTEXITCODE ao enviar artefatos oficiais para a release '$tag'!"
                }
                Write-Host "SUCESSO: Artefatos oficiais atualizados na release '$tag'."
              } else {
                Write-Host "IDEMPOTÊNCIA COMPROVADA: Todos os 3 artefatos oficiais já existem em $targetRepo e são criptograficamente idênticos."
              }

              # Sincronizar também com o repositório Tsujiu/visor-downloads
              try {
                Write-Host "Sincronizando espelho oficial Tsujiu/visor-downloads..."
                gh release upload "$tag" `
                  "dist/$setupName" `
                  "dist/$zipName" `
                  "dist/$manifestName" `
                  --repo "Tsujiu/visor-downloads" `
                  --clobber 2>$null
              } catch {
                Write-Host "Aviso ao sincronizar espelho: $_"
              }

              # 4. Ajustar status de Draft se aplicável
              if ($rel.isDraft -and -not $publishAsDraft) {
                Write-Host "Promovendo release de Rascunho (Draft) para Oficial definitiva..."
                gh release edit "$tag" --repo "$targetRepo" --draft=false
                if ($LASTEXITCODE -ne 0) {
                  throw "FALHA NA PROMOÇÃO: Erro ao remover status de rascunho da release '$tag'!"
                }
              }
            } finally {
              Remove-Item -Recurse -Force -Path $tempVerifyDir -ErrorAction SilentlyContinue
            }

            Write-Host "SUCESSO: Estado da release '$tag' em $targetRepo verificado e consolidado."
          }
